name: BrainboxRunner
options:
  bundleIdPrefix: com.neverprepared
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  groupSortPosition: bottom

settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_NAME: BrainboxRunner            # filename on disk; user-visible name lives in CFBundleDisplayName
    MARKETING_VERSION: "0.1.20"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: ""        # set via export DEVELOPMENT_TEAM=... before xcodegen
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  BrainboxRunner:
    type: application
    platform: macOS
    sources:
      - BrainboxRunner
    info:
      path: BrainboxRunner/Info.plist
      properties:
        CFBundleDisplayName: "Brainbox Runner"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Menu-bar-only app: no dock icon, no main menu in the menu bar
        LSUIElement: true
        NSHumanReadableCopyright: "© Never Prepared"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neverprepared.brainbox-runner
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BrainboxRunner/Info.plist
        CODE_SIGN_ENTITLEMENTS: BrainboxRunner/BrainboxRunner.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "5.9"
    scheme:
      testTargets:
        - BrainboxRunnerTests

  # Logic-test bundle. It compiles the units under test directly rather than
  # linking the app, so the tests run with no host application — a menu-bar
  # (LSUIElement) app is awkward to host, and these units are pure Foundation.
  BrainboxRunnerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: BrainboxRunner/Core/Redact.swift
      - path: BrainboxRunner/Core/DockerDriver.swift
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.neverprepared.brainbox-runner-tests
        ENABLE_HARDENED_RUNTIME: NO
        # Must override the project-wide PRODUCT_NAME (BrainboxRunner), or the
        # test bundle builds a second module of that name and collides with the
        # app's: "Multiple commands produce .../BrainboxRunner.swiftmodule".
        PRODUCT_NAME: BrainboxRunnerTests
        PRODUCT_MODULE_NAME: BrainboxRunnerTests
