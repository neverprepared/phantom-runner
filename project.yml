name: BrainboxRunner
options:
  bundleIdPrefix: com.neverprepared
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  groupSortPosition: bottom

settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_NAME: BrainboxRunner            # filename on disk; user-visible name lives in CFBundleDisplayName
    MARKETING_VERSION: "0.1.7"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""        # set via export DEVELOPMENT_TEAM=... before xcodegen
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  BrainboxRunner:
    type: application
    platform: macOS
    sources:
      - BrainboxRunner
    info:
      path: BrainboxRunner/Info.plist
      properties:
        CFBundleDisplayName: "Brainbox Runner"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Menu-bar-only app: no dock icon, no main menu in the menu bar
        LSUIElement: true
        NSHumanReadableCopyright: "© Never Prepared"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neverprepared.brainbox-runner
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BrainboxRunner/Info.plist
        CODE_SIGN_ENTITLEMENTS: BrainboxRunner/BrainboxRunner.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "5.9"
    preBuildScripts:
      - name: Build brainbox-bundler (Go)
        # Compiles the Go credential-sealing helper and drops the binary into
        # the app bundle Resources/. BundleBuilder.swift locates it via
        # Bundle.main.path(forResource:).
        script: |
          set -euo pipefail
          if ! command -v go >/dev/null 2>&1; then
            if [ -x /usr/local/go/bin/go ]; then
              export PATH="/usr/local/go/bin:$PATH"
            elif [ -x /opt/homebrew/bin/go ]; then
              export PATH="/opt/homebrew/bin:$PATH"
            else
              echo "error: go toolchain not found in PATH" >&2
              exit 1
            fi
          fi
          RESOURCES="$BUILT_PRODUCTS_DIR/$WRAPPER_NAME/Contents/Resources"
          mkdir -p "$RESOURCES"
          cd "$SRCROOT/bundler"
          GOOS=darwin go build -trimpath -ldflags="-s -w" \
            -o "$RESOURCES/brainbox-bundler" .
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(WRAPPER_NAME)/Contents/Resources/brainbox-bundler
